name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the develop branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # luacheck. The job keeps its original name, "build", in case a required check refers to it.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2

    # Use "Factorio Mod luacheck" from the marketplace
    - name: Factorio Mod luacheck
      uses: Roang-zero1/factorio-mod-luacheck@v1.1.0
      with:
          # URL to the luacheckrc configuration file to be used during checking.
          # Per https://github.com/Roang-zero1/factorio-mod-luacheck/issues/2 - an empty string will use the project's .luacheckrc
          luacheckrc_url: "" # optional, default is https://raw.githubusercontent.com/Nexela/Factorio-luacheckrc/0.17/.luacheckrc

  # TRIAL: one job, every template, more servers at once
  ingame-tests:
    name: in-game tests (${{ matrix.jobs }} at once)
    runs-on: ubuntu-latest
    env:
      FACTORIO_VERSION: "2.0.77"
    strategy:
      fail-fast: false
      matrix:
        jobs: [8, 12, 16]

    steps:
    - uses: actions/checkout@v4

    - name: Cache Factorio headless
      id: cache-factorio
      uses: actions/cache@v4
      with:
        path: ~/factorio
        key: factorio-headless-${{ env.FACTORIO_VERSION }}

    - name: Download Factorio headless
      if: steps.cache-factorio.outputs.cache-hit != 'true'
      run: curl -fsSL "https://www.factorio.com/get-download/${FACTORIO_VERSION}/headless/linux64" | tar -xJ -C ~

    - name: In-game tests
      shell: pwsh
      env:
        JOBS: ${{ matrix.jobs }}
        RESULTS_DIR: results
      run: ./.github/scripts/run-all.ps1 ~/factorio
